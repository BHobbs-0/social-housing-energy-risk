name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: End-to-end smoke test on synthetic data
        run: |
          python scripts/make_synthetic_data.py --rows 5000
          python -m housing_epc.pipeline --raw data/synthetic --no-shap
